[package]
name = "nacre"
version = "0.12.0"
edition = "2024"
rust-version = "1.99"
description = "Nacre compiler: affine ownership, lexical borrowing, and C11/native output"
license = "MIT"

[[bin]]
name = "nacre"
path = "src/main.rs"

[dependencies]
serde_json = "=1.0.154"

[features]
fuzzing = []

[profile.release]
lto = true
codegen-units = 1
strip = true
