[package]
name = "nacre"
version = "0.12.0"
edition = "2024"
rust-version = "1.99"
description = "Nacre compiler: affine ownership, lexical borrowing, and C11/native output"
license = "MIT"

[[bin]]
name = "nacre"
path = "src/main.rs"

[dependencies]

serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = "=0.9.12"
toml_edit = "=0.25.17"

[features]
fuzzing = []

[profile.release]
lto = true
codegen-units = 1
strip = true
