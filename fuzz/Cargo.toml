[package]
name = "nacre-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.99"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
nacre = { path = "..", features = ["fuzzing"] }

[[bin]]
name = "frontend"
path = "fuzz_targets/frontend.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lsp_frames"
path = "fuzz_targets/lsp_frames.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
