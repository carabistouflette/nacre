name: Nacre
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    name: Native ${{ matrix.backend }} / ${{ matrix.cc }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - cc: gcc
            backend: c
          - cc: clang
            backend: c
          - cc: clang
            backend: llvm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: ".python-version"
      - name: Install native library headers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm cmake patch libssl-dev zlib1g-dev libgmp-dev libcurl4-openssl-dev libicu-dev libarchive-dev libxml2-dev libxslt1-dev libsqlite3-dev liburiparser-dev libpcre2-dev
      - name: Select matching LLVM tools
        run: |
          llvm_bin=$(/usr/bin/llvm-config --bindir)
          printf '%s\n' "NACRE_CLANG=$llvm_bin/clang" "NACRE_LLVM_LINK=$llvm_bin/llvm-link" >> "$GITHUB_ENV"
          "$llvm_bin/clang" --version
          "$llvm_bin/llvm-link" --version
      - name: Build corrected seekable ZIP dependency
        run: |
          prefix="$RUNNER_TEMP/nacre-native-deps"
          python3 scripts/build_libarchive.py --prefix "$prefix"
          printf '%s\n' "CPATH=$prefix/include" "LIBRARY_PATH=$prefix/lib" "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - run: python3 scripts/generate_v2_tests.py --check
      - run: python3 scripts/generate_v3_tests.py --check
      - run: python3 scripts/generate_v4_tests.py --check
      - run: python3 scripts/generate_v5_tests.py --check
      - name: Exercise publishing workflow
        if: matrix.cc == 'gcc'
        run: python3 scripts/test_publish.py
      - run: cargo fetch --locked
      - name: Lint all Rust targets
        if: matrix.cc == 'gcc' && matrix.backend == 'c'
        run: cargo clippy --locked --offline --all-targets --features fuzzing -- -D warnings
      - run: cargo test --locked --offline
        env:
          NACRE_CC: ${{ matrix.cc }}
          NACRE_TEST_BACKEND: ${{ matrix.backend }}
      - if: matrix.backend == 'c'
        run: python3 scripts/test_runtime.py --cc ${{ matrix.cc }}
      - if: matrix.backend == 'c'
        run: python3 scripts/test_borrow_support.py --cc ${{ matrix.cc }}
      - if: matrix.backend == 'c'
        run: python3 scripts/test_interface_support.py --cc ${{ matrix.cc }}
      - if: matrix.backend == 'c'
        run: python3 scripts/test_stdlib_support.py --cc ${{ matrix.cc }}
      - if: matrix.backend == 'c'
        run: python3 scripts/validate.py --cc ${{ matrix.cc }} --sanitizers --report docs/ci-validation.json
      - if: matrix.cc == 'clang' && matrix.backend == 'c'
        run: cargo test --locked --offline --test interfaces_generics_tools -- --ignored
  editors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".node-version"
      - run: npm install --global "npm@$(cat .npm-version)"
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: ".python-version"
      - name: Install repository Rust toolchain and WASI target
        run: |
          rustup show active-toolchain
          rustup target add wasm32-wasip2
      - run: cargo build --locked
      - run: npm --prefix editors/vscode ci
      - run: npm --prefix editors/vscode test
      - run: npm --prefix editors/vscode run package
      - run: npm --prefix editors/tree-sitter-nacre ci
      - run: npm --prefix editors/tree-sitter-nacre run generate
      - run: npm --prefix editors/tree-sitter-nacre test
      - run: python3 -m pip install tree-sitter==0.26.0
      - run: python3 editors/zed/check.py
      - run: python3 editors/zed/prepare.py
      - run: cargo build --manifest-path editors/zed/dist/nacre/Cargo.toml --target wasm32-wasip2 --release --locked

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: ".python-version"
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - run: python3 scripts/fuzz_smoke.py
